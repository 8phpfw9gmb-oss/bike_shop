<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа — Bike Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f13;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            padding: 22px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,.5);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color .2s;
        }
        .back-link:hover { color: #a78bfa; }

        /* ── Layout ── */
        main {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 20px 60px;
        }
        .card {
            background: linear-gradient(145deg, #1c1c2e, #16162a);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
            animation: fadeUp .4s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #f0f0ff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Bike info block ── */
        .bike-info {
            background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(96,165,250,.08));
            border: 1px solid rgba(99,102,241,.25);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }
        .bike-info::before {
            content: '🚲';
            position: absolute;
            right: 18px; top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            opacity: .12;
        }
        .bike-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #e0e0ff;
            margin-bottom: 4px;
        }
        .bike-info p {
            font-size: 13px;
            color: rgba(255,255,255,.45);
            margin-bottom: 12px;
        }
        .price {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Form ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,.5);
            letter-spacing: .5px;
            text-transform: uppercase;
        }
        input {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            padding: 13px 16px;
            color: #f0f0ff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: border-color .2s, background .2s, box-shadow .2s;
            outline: none;
            width: 100%;
        }
        input::placeholder { color: rgba(255,255,255,.2); }
        input:focus {
            border-color: #6366f1;
            background: rgba(99,102,241,.08);
            box-shadow: 0 0 0 3px rgba(99,102,241,.15);
        }

        .submit-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 6px 24px rgba(99,102,241,.4);
            letter-spacing: .3px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(99,102,241,.55);
        }
        .submit-btn:active { transform: translateY(0); }

        .note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255,255,255,.25);
        }
        .note a { color: rgba(165,180,252,.5); text-decoration: none; }
        .note a:hover { color: #a5b4fc; }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">🚲 Bike Shop</a>
    <a href="/" class="back-link">← Назад в магазин</a>
</header>

<main>
    <div class="card">
        <h2 class="page-title">Оформление заказа</h2>

        <div class="bike-info">
            <h3>{{ bike[1] }}</h3>
            <p>{{ bike[2] }} &mdash; {{ bike[3] }}</p>
            <div class="price">{{ bike[14] }} ₽</div>
        </div>

        <form method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="first_name" placeholder="Александр" required>
                </div>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" name="last_name" placeholder="Иванов" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="email@mail.ru" required>
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="text" name="phone" placeholder="+7 900 000 00 00" required>
                </div>
                <div class="form-group full">
                    <label>Адрес доставки</label>
                    <input type="text" name="address" placeholder="Город, улица, дом, квартира" required>
                </div>
            </div>
            <button class="submit-btn" type="submit">
                Оформить заказ ✓
            </button>
        </form>

        <p class="note">
            Нажимая кнопку, вы соглашаетесь с <a href="#">условиями использования</a>
        </p>
    </div>
</main>

</body>
</html>
