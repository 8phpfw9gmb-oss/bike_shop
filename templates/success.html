<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ оформлен — Bike Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f13;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            padding: 22px 32px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: linear-gradient(145deg, #1c1c2e, #16162a);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 28px;
            padding: 56px 48px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
            animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
            position: relative;
            overflow: hidden;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.85); }
            to   { opacity: 1; transform: scale(1); }
        }
        .card::before {
            content: '';
            position: absolute;
            top: -80px; left: 50%;
            transform: translateX(-50%);
            width: 280px; height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52,211,153,.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .icon-wrap {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52,211,153,.2), rgba(16,185,129,.1));
            border: 2px solid rgba(52,211,153,.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 28px;
            animation: pulse 2s ease infinite;
            position: relative;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,.3); }
            50%       { box-shadow: 0 0 0 14px rgba(52,211,153,0); }
        }

        h2 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #f0f0ff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255,255,255,.45);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .steps {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 16px;
            padding: 22px 24px;
            margin-bottom: 32px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            color: rgba(255,255,255,.55);
        }
        .step-num {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 6px 24px rgba(99,102,241,.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(99,102,241,.55);
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">🚲 Bike Shop</a>
</header>

<main>
    <div class="card">
        <div class="icon-wrap">✓</div>
        <h2>Заказ оформлен!</h2>
        <p class="subtitle">
            Спасибо за покупку! Мы получили ваш заказ<br>
            и свяжемся с вами в ближайшее время.
        </p>

        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                Подтверждение заказа — на вашу почту
            </div>
            <div class="step">
                <div class="step-num">2</div>
                Подготовка и упаковка велосипеда
            </div>
            <div class="step">
                <div class="step-num">3</div>
                Доставка в течение 3–5 рабочих дней
            </div>
        </div>

        <a href="/" class="btn">← Вернуться в магазин</a>
    </div>
</main>

</body>
</html>
